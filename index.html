<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DOON</title>
<style>
/* 티켓팅 화면(pop/frontend/login.html)과 같은 규칙 */
* { box-sizing: border-box; }
body { margin:0; background:#fafafa; color:#222;
  font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic','맑은 고딕',sans-serif;
  -webkit-font-smoothing:antialiased; }
.brandbar { background:#fff; border-bottom:1px solid #eee; }
.brandbar .inner { max-width:1120px; margin:0 auto; padding:14px 24px;
  display:flex; align-items:center; justify-content:space-between; gap:16px; }
.brandline { font-size:14px; color:#777; letter-spacing:-0.2px; }
.brandline b { font-size:24px; font-weight:700; color:#111; letter-spacing:-0.5px; margin-right:8px; }

.wrap { max-width:460px; margin:0 auto; padding:44px 24px 80px; }
.h1 { font-size:24px; font-weight:700; color:#111; letter-spacing:-0.6px; text-align:center; margin:0 0 6px; }
.sub { font-size:13px; color:#888; text-align:center; margin:0 0 28px; line-height:1.6; }

.status { background:#fff; border:1px solid #e8e8e8; border-radius:8px; padding:16px 18px;
  font-size:14px; color:#444; line-height:1.6; margin-bottom:14px; }
.status b { color:#111; }
.status.warn { background:#FFF6EE; border-color:#F5D2AE; color:#B3560A; }
.badge { display:inline-block; font-size:11px; color:#B3560A; background:#FFF6EE;
  border:1px solid #F5D2AE; border-radius:3px; padding:0 6px; margin-left:6px; vertical-align:1px; }

.card { background:#fff; border:1px solid #e8e8e8; border-radius:8px; padding:6px 22px; }
table { width:100%; border-collapse:collapse; font-size:14px; }
th, td { text-align:left; padding:12px 0; border-bottom:1px solid #f0f0f0; }
tr:last-child td { border-bottom:0; }
th { font-size:12.5px; color:#999; font-weight:700; }
.num { text-align:right; font-variant-numeric:tabular-nums; }
tr.pick td { font-weight:700; color:#F5821F; }
tr.off td { color:#aaa; }
td a { color:#222; font-weight:700; text-decoration:none; }
td a:hover { color:#F5821F; }

.actions { display:flex; gap:8px; margin-top:16px; }
.btn { flex:1; display:block; text-align:center; background:#F5821F; color:#fff; border:0;
  padding:14px 0; font-size:15.5px; font-weight:700; border-radius:3px; cursor:pointer;
  font-family:inherit; letter-spacing:-0.3px; text-decoration:none; }
.btn:hover { background:#DE7115; }
.btn.ghost { flex:0 0 auto; padding:14px 18px; background:#fff; color:#555; border:1px solid #ddd; font-weight:500; }
.btn.ghost:hover { background:#f5f5f5; }
[hidden] { display:none !important; }
#cd { white-space:nowrap; color:#888; }

details { margin-top:22px; font-size:12.5px; color:#888; }
summary { cursor:pointer; }
#places { display:flex; flex-wrap:wrap; gap:6px; margin:10px 0 0; }
#places a { font-size:12.5px; color:#555; background:#fff; border:1px solid #e8e8e8;
  border-radius:3px; padding:4px 10px; text-decoration:none; }
#places a:hover { border-color:#F5821F; color:#F5821F; }
.note { font-size:11.5px; color:#999; line-height:1.75; margin-top:22px; }
</style>
</head>
<body>
<div class="brandbar"><div class="inner">
  <div class="brandline"><b>DOON</b>티켓팅에 공정을 담다. with KOREN</div>
</div></div>

<div class="wrap">
  <h1 class="h1">가까운 PoP로 연결합니다</h1>
  <p class="sub">브라우저 위치로 가장 가까운 지역 PoP를 고릅니다</p>

  <div id="status" class="status">위치를 확인하는 중입니다…</div>

  <div class="card">
    <table>
      <thead><tr><th>PoP</th><th class="num">거리</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>

  <div class="actions" id="actions" hidden>
    <a class="btn" id="go" href="#">바로 연결</a>
    <button class="btn ghost" id="stop">자동 이동 멈추기</button>
  </div>

  <details>
    <summary>다른 지역에서 접속한 것처럼 보기 (시연용)</summary>
    <p id="places"></p>
  </details>

  <p class="note">위치는 이 페이지 안에서 거리 계산에만 쓰이고 서버로 전송되지 않습니다.<br>
  K-디지털 챌린지: 넷 챌린지 캠프 시즌13 · Team Doon</p>
</div>

<script>
(async function () {
  const $ = (id) => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  const cfg = await (await fetch('pops.json', { cache: 'no-store' })).json();
  const pops = cfg.pops;
  const live = pops.filter((p) => p.enabled && p.url);
  let timer = null;

  // 시연용 위치 목록
  $('places').innerHTML = Object.entries(cfg.places)
    .map(([k, v]) => `<a href="?loc=${k}">${v.name}</a>`).join('');

  function km(lat1, lon1, lat2, lon2) {
    const r = Math.PI / 180;
    const a = Math.sin((lat2 - lat1) * r / 2) ** 2 +
      Math.cos(lat1 * r) * Math.cos(lat2 * r) * Math.sin((lon2 - lon1) * r / 2) ** 2;
    return 6371 * 2 * Math.asin(Math.sqrt(a));
  }

  function render(from, label, simulated) {
    const ranked = pops
      .map((p) => ({ ...p, d: from ? km(from.lat, from.lon, p.lat, p.lon) : null }))
      .sort((a, b) => (a.d ?? 0) - (b.d ?? 0));
    const pick = ranked.find((p) => p.enabled && p.url);

    $('rows').innerHTML = ranked.map((p) => {
      const cls = p === pick ? 'pick' : (p.enabled && p.url ? '' : 'off');
      const tag = p.enabled && p.url ? '' : `<span class="badge">${p.note || '비활성'}</span>`;
      const dist = p.d == null ? '-' : `${p.d < 10 ? p.d.toFixed(1) : Math.round(p.d)} km`;
      return `<tr class="${cls}"><td>${p.name}${tag}</td><td class="num">${dist}</td></tr>`;
    }).join('');

    const sim = simulated ? '<span class="badge">시뮬레이션</span>' : '';
    $('status').className = 'status';
    $('status').innerHTML = `${label}${sim} → <b>${pick.name} PoP</b>로 연결합니다<span id="cd"><br><span id="count">3</span>초 후 이동합니다</span>`;
    go(pick);
  }

  function go(pop) {
    $('go').href = pop.url;
    $('actions').hidden = false;
    let n = 3;
    clearInterval(timer);
    timer = setInterval(() => {
      n -= 1;
      if ($('count')) $('count').textContent = n;
      if (n <= 0) { clearInterval(timer); location.href = pop.url; }
    }, 1000);
  }

  $('stop').onclick = () => {
    clearInterval(timer);
    if ($('cd')) $('cd').remove();
    $('stop').hidden = true;
  };

  function manual(reason) {
    $('status').className = 'status warn';
    $('status').textContent = `${reason} 연결할 PoP를 직접 고르세요.`;
    $('rows').innerHTML = live.map((p) =>
      `<tr><td><a href="${p.url}">${p.name} PoP</a></td><td class="num">-</td></tr>`).join('');
  }

  // ?pop=pop-daejeon : 지정한 PoP로 바로 연결
  const forced = live.find((p) => p.id === params.get('pop'));
  if (forced) { location.replace(forced.url); return; }

  // ?loc=busan : 그 지역에서 접속한 것으로 계산
  const place = cfg.places[params.get('loc')];
  if (place) { render(place, `${place.name}에서 접속`, true); return; }

  if (!window.isSecureContext || !navigator.geolocation) {
    manual('이 페이지는 HTTPS에서만 위치를 확인할 수 있습니다.');
    return;
  }

  // 최근 10분 안에 받은 위치가 있으면 바로 쓴다 (이 브라우저에만 저장, 서버로 보내지 않음)
  const CACHE = 'doon.lastpos', TTL = 10 * 60 * 1000;
  try {
    const c = JSON.parse(localStorage.getItem(CACHE) || 'null');
    if (c && Date.now() - c.t < TTL) {
      render({ lat: c.lat, lon: c.lon }, `최근 확인한 위치(오차 약 ${c.acc}m)`, false);
      return;
    }
  } catch (e) {}

  // 기다리는 동안에도 바로 고를 수 있게 PoP 목록을 먼저 보여준다
  $('rows').innerHTML = live.map((p) =>
    `<tr><td><a href="${p.url}">${p.name} PoP</a></td><td class="num">-</td></tr>`).join('');
  const t0 = Date.now();
  const tick = setInterval(() => {
    $('status').textContent = `위치를 확인하는 중입니다… ${Math.floor((Date.now() - t0) / 1000)}초 ` +
      '(주소창 옆 위치 허용 창을 확인하세요. 기다리지 않고 아래에서 바로 고를 수도 있습니다)';
  }, 1000);

  navigator.geolocation.getCurrentPosition(
    (pos) => {
      clearInterval(tick);
      const c = { lat: pos.coords.latitude, lon: pos.coords.longitude,
                  acc: Math.round(pos.coords.accuracy), t: Date.now() };
      try { localStorage.setItem(CACHE, JSON.stringify(c)); } catch (e) {}
      render(c, `현재 위치(오차 약 ${c.acc}m)`, false);
    },
    (err) => {
      clearInterval(tick);
      manual(err.code === 1 ? '위치 권한이 거부되었습니다.' : '위치를 확인하지 못했습니다.');
    },
    { enableHighAccuracy: false, timeout: 5000, maximumAge: TTL }
  );
})();
</script>
</body>
</html>
